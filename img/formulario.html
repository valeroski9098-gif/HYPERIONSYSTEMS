<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Formulario Hyperion Systems</title>

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<section class="form-section">

<div class="form-container">

<h1>¿LISTO PARA CRECER?</h1>

<p>
Complete el formulario y un miembro de Hyperion Systems se pondrá en contacto con usted.
</p>

<form>

<div class="form-group">
<input type="text" placeholder="Nombre" required>
</div>

<div class="form-group">
<input type="text" placeholder="Apellido" required>
</div>

<div class="form-group">
<input type="email" placeholder="Correo Electrónico" required>
</div>

<div class="form-group">
<input type="tel" placeholder="Número de Teléfono" required>
</div>

<div class="form-group">
<textarea placeholder="¿En qué podemos ayudarle?" required></textarea>
</div>

<button type="submit" class="submit-btn">
SOLICITAR INFORMACIÓN
</button>

</form>

</div>

</section>

</body>

</html>
